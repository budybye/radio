name: radio

# Core stack: mpd + mpc-bridge (always started by `make up`).
# Optional tunnel: `make up-tunnel` or `docker compose --profile tunnel up -d`.
services:
  mpd:
    # Option A: Build locally (default)
    build: .
    # Option B: Use pre-built image from GHCR (uncomment below, comment out `build: .`)
    # image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-budybye}/radio-mpd:latest
    container_name: radio-mpd
    volumes:
      - ./music:/music
      - ./config/mpd.conf:/etc/mpd.conf:ro
      - ./config/config:/root/.ncmpcpp/config:ro
      - mpd-data:/var/lib/mpd
    expose:
      - "6600"
      - "8000"
    # ports:
    #   - "127.0.0.1:6600:6600"  # MPD control (mpc / ncmpcpp from host)
    #   - "127.0.0.1:8000:8000"  # HTTP stream (local testing)
    # NOTE: Uncomment only if you need host-side access. Default: all access via Tunnel or `docker compose exec`
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mpc status >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  mpc-bridge:
    build: ./mpc-bridge
    container_name: radio-mpc-bridge
    environment:
      MPD_HOST: mpd
      MPD_PORT: "6600"
      POOL_SIZE: "4"
    expose:
      - "8080"
    depends_on:
      mpd:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- ''http://127.0.0.1:8080/mpd.cgi?cmd=ping'' 2>/dev/null | grep -q ''"ok":true''',
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    container_name: radio-tunnel
    env_file:
      - .env
    command: tunnel run --token ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env for tunnel profile}
    restart: unless-stopped
    depends_on:
      mpd:
        condition: service_healthy
      mpc-bridge:
        condition: service_healthy

volumes:
  mpd-data:

networks:
  default:
    name: radio-network
    driver: bridge
