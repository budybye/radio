music_directory         "/music"
playlist_directory      "/var/lib/mpd/playlists"
db_file                 "/var/lib/mpd/database"
pid_file                "/run/mpd/pid"
state_file              "/var/lib/mpd/state"

bind_to_address         "0.0.0.0"
port                    "6600"
zeroconf_enabled        "no"
max_connections         "100"
connection_timeout      "60"

auto_update             "yes"
auto_update_depth       "0"
follow_inside_symlinks  "yes"
filesystem_charset      "UTF-8"

replaygain              "auto"
save_absolute_paths_in_playlists "yes"

audio_output {
    type        "fifo"
    name        "Visualizer Feed"
    path        "/var/lib/mpd/mpd.fifo"
    format      "44100:16:2"
    enabled     "yes"
}

audio_output {
    type            "httpd"
    name            "Radio Stream"
    encoder         "lame"
    port            "8000"
    bind_to_address "0.0.0.0"
    bitrate         "320"
    format          "44100:16:2"
    max_clients     "10"
    always_on       "yes"
    tags            "yes"
    mixer_type      "none"
}
